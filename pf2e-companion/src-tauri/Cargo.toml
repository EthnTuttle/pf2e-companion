[package]
name = "pf2e-companion"
version = "0.1.0"
description = "Cross-platform PF2e + Biblical-reskin reference & worldbuilding companion"
authors = ["Gary Krause"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pf2e_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# tauri-plugin-dialog is platform-scoped below ([76] review fix):
# global default-features=false would strip native macOS/Windows dialog backends.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage layer (plan § 2.4)
rusqlite = { version = "0.32", features = ["bundled", "load_extension", "serde_json"] }
sqlite-vec = "0.1"

# Vault watcher (plan § 4.1)
notify = "8"

# Markdown + frontmatter (Phase 1 prep)
pulldown-cmark = "0.12"
serde_yaml = "0.9"

# Async runtime + utilities. `net` + `time` are required by the Phase 10
# LAN bridge (tokio::net::TcpListener) and debounced autosave.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs", "net", "time"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
include_dir = "0.7.4"

# LLM layer (Phase 6 § B). Provider-agnostic HTTP client for Anthropic + Ollama.
# rustls-only to avoid native-tls / OpenSSL on every target.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
keyring = "3.6.3"
eventsource-stream = "0.2.3"
futures-util = "0.3.32"
async-trait = "0.1"

# Phase 10 — Live Table (contract §2). Nothing else may be added.
automerge = "0.12"
tokio-tungstenite = { version = "0.30", optional = true }
iroh = { version = "1.3", optional = true }
iroh-tickets = { version = "1.0", optional = true }   # 1.x-compatible per contract §2 note (0.5 pins iroh-base 0.98)

[features]
default = ["lan", "p2p"]
lan = ["dep:tokio-tungstenite"]
p2p = ["dep:iroh", "dep:iroh-tickets"]

[dev-dependencies]
tempfile = "3.27.0"

# Save-as dialog backend. Linux: XDG desktop portal (pure Rust via ashpd; builds
# without GTK dev packages — webkit2gtk still supplies GTK at runtime). All other
# targets: upstream defaults; the gtk3 default feature is cfg-inert off-Linux and
# rfd's native macOS/Windows backends stay unconditional.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2"
